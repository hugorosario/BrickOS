name: Publish project website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build-site.mjs'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  # The site shows the latest published release, so a new release rebuilds it. The
  # github-pages environment deploys only from main, so a release runs this workflow on main.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the website workflow on main
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        id: pages
      # versions.json may already name the next release; the site shows the published one.
      - name: Find the latest published release
        id: release
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          test -n "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build static website
        run: node tools/build-site.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_VERSION: ${{ steps.release.outputs.version }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
